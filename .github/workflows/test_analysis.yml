name: Test Analysis

on:
  # Every PR, whatever its base -- fork work targets tdp-gws-integration, not main,
  # so a `branches: [main]` filter here means no PR is ever checked.
  pull_request:
  # Direct pushes to the long-lived branches. This job builds a conda env and runs the
  # whole small-test pipeline, so it is deliberately not run on every feature-branch
  # push; the PR run covers those.
  push:
    branches: [ main, zarr3, tdp-gws, tdp-gws-integration ]
  workflow_dispatch:

# A force-push should supersede its own in-flight run, not queue behind it.
# Workflow-level, so the group covers the whole run: every matrix leg of a
# superseded run is cancelled together. Do not add matrix values to the group --
# that would let a stale leg outlive the run that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-analysis:
    # Pinned deliberately: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, which
    # would change the OS under a conda env + compiled scientific stack without
    # warning. ruff-check-format.yml stays on ubuntu-latest as the canary -- it is a
    # ~1 min job with little to break, so it surfaces the migration early and cheaply.
    runs-on: ubuntu-24.04

    # tiff/zarr run the Snakemake pipeline in each output format; direct runs the
    # four direct runners, which is the path every real plate run takes and which
    # Snakemake never touches (#52). One job with three legs so all three reuse
    # the conda setup and test-data cache below.
    strategy:
      fail-fast: false
      matrix:
        leg: [tiff, zarr, direct]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No disk cleanup: the runner starts with ~87 GB free and a leg writes ~5 GB
      # (measured on run #44), so the old cleanup step bought ~1.7 min of nothing per
      # leg. The disk report at the end of the job keeps the real headroom visible.

      # Set up Conda
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          channels: conda-forge

      # Set up environment
      - name: Set up brieflow environment
        shell: bash -l {0}
        run: |
          # Create conda environment
          conda create -n brieflow_ci -c conda-forge python=3.12 uv pip -y
          conda activate brieflow_ci
          
          # Install Python dependencies with uv
          uv pip install -r pyproject.toml
          uv pip install -e .

      # Activate environment for subsequent steps
      - name: Initialize conda environment
        shell: bash -l {0}
        run: |
          conda activate brieflow_ci
          echo "CONDA_DEFAULT_ENV=brieflow_ci" >> $GITHUB_ENV

      # Fail fast: run the suite before the test data and the pipeline. A unit-test
      # break otherwise surfaces only after a 24-75 min leg (run #54: the same 9
      # failures on all three legs, reported 37-61 min in). Tests that need the
      # test data or pipeline outputs skip here and run for real in the post-pipeline
      # `pytest -rs` step below. BRIEFLOW_REQUIRE_ZARR is left unset on purpose: no
      # leg has a zarr store yet.
      - name: Run pytest (before pipeline)
        shell: bash -l {0}
        run: |
          conda activate brieflow_ci
          pytest -q

      # 1.31 GB from Zenodo: 5-9 min per leg cold. Restore and save are separate
      # steps so the data is cached right after download -- the combined
      # actions/cache saves at job end and skips the save when the leg fails.
      # PR runs can restore the cache written by pushes to their base branch.
      - name: Restore small test data
        id: test-data
        uses: actions/cache/restore@v4
        with:
          path: tests/small_test_analysis/small_test_data
          key: small-test-data-${{ hashFiles('tests/small_test_analysis/small_test_analysis_setup.py') }}

      - name: Run small test setup
        if: steps.test-data.outputs.cache-hit != 'true'
        shell: bash -l {0}
        working-directory: tests/small_test_analysis
        run: |
          conda activate brieflow_ci
          python small_test_analysis_setup.py

      # On a cold cache all three legs try to save the same key; one wins and the
      # others log a warning, not a failure.
      - name: Save small test data
        if: steps.test-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/small_test_analysis/small_test_data
          key: ${{ steps.test-data.outputs.cache-primary-key }}

      # Run Brieflow through Snakemake. Named "via Snakemake" because the step
      # name interpolates the leg: on the direct leg it would read "Run Brieflow
      # (direct)" and then skip itself, which looks like the direct leg never ran.
      # The direct leg's real work is the "Run direct runners" step below.
      - name: Run Brieflow via Snakemake (${{ matrix.leg }})
        if: matrix.leg != 'direct'
        shell: bash -l {0}
        working-directory: tests/small_test_analysis
        run: |
          conda activate brieflow_ci
          mkdir -p "$PWD/tmp"
          export TMPDIR="$PWD/tmp"
          sh run_brieflow.sh ${{ matrix.leg == 'zarr' && '--zarr' || '' }}

      # Run the direct runners (the production path; Snakemake never calls them)
      - name: Run direct runners
        if: matrix.leg == 'direct'
        shell: bash -l {0}
        working-directory: tests/small_test_analysis
        env:
          # 2-core hosted runner / --workers 2 -> 1 thread each. Without caps,
          # numpy/OpenBLAS sizes to the core count *per worker* and thrashes.
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_MAX_THREADS: 1
        run: |
          # `shell: bash -l {0}` does not imply -e, and the step's exit code is
          # the last command's -- without this a failing preprocess is invisible.
          set -e
          conda activate brieflow_ci
          mkdir -p "$PWD/tmp"
          export TMPDIR="$PWD/tmp"
          D=../../scripts/direct
          python $D/run_preprocess_direct.py --config config/config.yml --workers 2
          # --step all makes combine_after() return True for real, so the combine
          # wiring is exercised by execution rather than by a stubbed predicate.
          python $D/run_sbs_direct.py       --config config/config.yml --workers 2 --step all
          python $D/run_phenotype_direct.py --config config/config.yml --workers 2 --step all
          python $D/run_merge_direct.py     --config config/config.yml --workers 2 --step all

      # Exit 0 is not a test: assert the artifacts exist and hold real data.
      - name: Verify outputs (${{ matrix.leg }})
        shell: bash -l {0}
        working-directory: tests/small_test_analysis
        run: |
          conda activate brieflow_ci
          python verify_outputs.py ${{ matrix.leg }}

      # Run Pytest on every leg. It was gated to tiff on the grounds that the
      # suite is output-format agnostic, but the HCS/zarr store assertions in
      # tests/test_hcs_metadata.py are not: on a tiff-only leg they find no zarr
      # store and skip, so they had never once executed in CI (#70). The zarr leg
      # produces exactly those stores. The direct leg runs last because it is the
      # path every real plate run takes on broad-cpu, so it is the one that most
      # needs the suite behind it -- the ~200 leg-independent tests re-running
      # there is the price, and at ~29 s against legs of 24-75 min it is noise.
      #
      # BRIEFLOW_REQUIRE_ZARR turns "no zarr store found" from a skip into a
      # failure, so the #70 gap cannot silently reopen. Scoped to the zarr leg
      # ONLY: tiff and direct both run config/config.yml, which is the TIFF
      # config writing to brieflow_output/ (see verify_outputs.py LEGS), so they
      # have no zarr store by design and setting it there would be a guaranteed
      # false failure.
      #
      # -rs surfaces the skip reasons, so a machine-gated E2E test
      # (scripts/direct/tests/test_postseg_e2e_smoke.py) reads as a documented skip
      # in the run summary instead of as coverage.
      - name: Run pytest
        shell: bash -l {0}
        env:
          BRIEFLOW_REQUIRE_ZARR: ${{ matrix.leg == 'zarr' && '1' || '0' }}
        run: |
          conda activate brieflow_ci
          pytest -rs

      - name: Report disk headroom
        if: always()
        run: df -h /
