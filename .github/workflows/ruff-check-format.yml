name: Ruff Check & Format

on:
  # Every PR, whatever its base -- fork work targets tdp-gws-integration, not main,
  # so a `branches: [main]` filter here means no PR is ever checked.
  pull_request:
  # Every push, every branch. This job is ~1 minute, so a development branch or
  # worktree gets lint feedback while it is still being worked on, before a PR
  # exists to hang a check off. Contrast test_analysis.yml, which is far too
  # heavy to run per-push and stays scoped to the long-lived branches.
  push:
  workflow_dispatch:

# A force-push should supersede its own in-flight run, not queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.9
          
      - name: Run Ruff check
        run: ruff check .
        
      - name: Check formatting
        run: ruff format --check
