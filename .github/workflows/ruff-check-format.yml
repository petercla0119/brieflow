name: Ruff Check & Format

on:
  # Every PR, whatever its base -- fork work targets tdp-gws-integration, not main,
  # so a `branches: [main]` filter here means no PR is ever checked.
  pull_request:
  # Direct pushes to the long-lived branches. Feature branches are covered by their
  # PR run, so listing them here would only duplicate it.
  push:
    branches: [ main, zarr3, tdp-gws, tdp-gws-integration ]
  workflow_dispatch:

# A force-push should supersede its own in-flight run, not queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.9
          
      - name: Run Ruff check
        run: ruff check .
        
      - name: Check formatting
        run: ruff format --check
